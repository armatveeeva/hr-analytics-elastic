[tool.poetry]
name = "hr-analytics-elastic"
version = "0.1.0"
description = "HR analytics pipeline with Elasticsearch"
authors = ["Anastasiia Matveeva <armatveeeva@gmail.com>"]
packages = [{ include = "hr_analytics", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
elasticsearch = "^8.15.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.9"
mypy = "^1.11.0"
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
pre-commit = "^3.8.0"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=hr_analytics"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
