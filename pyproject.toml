[tool.poetry]
name = "hr-analytics-elastic"
version = "0.1.0"
description = "HR data pipeline with Elasticsearch"
authors = ["armatveeeva <armatveeeva@gmail.com>"]
readme = "README.md"
packages = [{include = "hr_analytics", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
elasticsearch = ">=8.0.0,<9.0.0"
python-dotenv = ">=1.0.0"
pydantic = ">=2.0.0"
pandas = ">=2.0.0"
pydantic-settings = "^2.16.2"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.4.0"
mypy = ">=1.10.0"
pytest = ">=8.0.0"
pre-commit = ">=3.7.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
